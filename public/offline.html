<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3A2B27" />
    <title>Você está offline</title>
    <style>
      :root {
        color: #3A2B27;
        background: #FFF8F6;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 420px;
        border: 1px solid #F3E3D3;
        border-radius: 18px;
        background: white;
        padding: 28px;
        text-align: center;
        box-shadow: 0 18px 45px rgba(92, 64, 51, 0.09);
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        border-radius: 14px;
        background: #F5EAD8;
        display: grid;
        place-items: center;
        color: #D8948B;
        font-size: 24px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 10px 0 0;
        color: #7A6F6B;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">♡</div>
      <h1>Você está offline</h1>
      <p>Algumas informações podem não estar disponíveis até a conexão voltar.</p>
    </main>
  </body>
</html>
